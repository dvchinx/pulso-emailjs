<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Ilustración: sobre de bienvenida de Pulso</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#FFFFFF" opacity=".18"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#14110F" flood-opacity=".25"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#14110F" flood-opacity=".18"/>
    </filter>
    <path id="spark" d="M0-12C.7-4 4-.7 12 0 4 .7.7 4 0 12-.7 4-4 .7-12 0-4-.7-.7-4 0-12z"/>
  </defs>

  <rect width="600" height="480" fill="#FF5A36"/>
  <rect width="600" height="480" fill="url(#dots)"/>

  <!-- sol -->
  <circle cx="478" cy="128" r="104" fill="#FFB547"/>
  <circle cx="478" cy="128" r="140" fill="none" stroke="#FFB547" stroke-width="2" opacity=".45"/>

  <!-- tarjeta de métrica -->
  <g filter="url(#sh2)">
    <rect x="40" y="146" width="186" height="78" rx="16" fill="#FFFFFF"/>
  </g>
  <text x="60" y="184" font-size="24" font-weight="700" fill="#14110F">48%</text>
  <text x="60" y="206" font-size="11.5" fill="#6B625C">tasa de apertura</text>
  <polyline points="156,192 168,184 180,188 192,174 204,168" fill="none" stroke="#1E8E5A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="204" cy="168" r="4" fill="#1E8E5A"/>

  <!-- bloque violeta -->
  <g transform="translate(92 74) rotate(12)" filter="url(#sh2)">
    <rect x="-34" y="-34" width="68" height="68" rx="18" fill="#7B61FF"/>
  </g>
  <use href="#spark" transform="translate(92 74) scale(1.25)" fill="#FFFFFF"/>

  <!-- sobre + carta -->
  <g transform="translate(326 108) rotate(-4)">
    <g filter="url(#sh)">
      <!-- carta -->
      <rect x="22" y="-6" width="206" height="160" rx="12" fill="#FBF8F3"/>
      <path d="M34 -6h182a12 12 0 0 1 12 12v28H22V6a12 12 0 0 1 12-12z" fill="#14110F"/>
      <text x="125" y="20" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">pulso<tspan fill="#FF5A36">.</tspan></text>
      <rect x="42" y="52" width="150" height="8" rx="4" fill="#E9E0D6"/>
      <rect x="42" y="68" width="122" height="8" rx="4" fill="#E9E0D6"/>
      <rect x="42" y="84" width="138" height="8" rx="4" fill="#E9E0D6"/>
      <rect x="42" y="104" width="92" height="22" rx="6" fill="#FF5A36"/>
      <!-- sobre (frente) -->
      <path d="M0 92 L125 168 L250 92 V258 a14 14 0 0 1-14 14 H14 a14 14 0 0 1-14-14z" fill="#FFFFFF"/>
    </g>
    <path d="M0 262 L102 178 M250 262 L148 178" stroke="#F1E9E1" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M2 94 L125 170 L248 94" stroke="#F1E9E1" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <!-- sello -->
    <circle cx="125" cy="214" r="20" fill="#FF5A36"/>
    <use href="#spark" transform="translate(125 214) scale(.85)" fill="#FFFFFF"/>
  </g>

  <!-- destellos -->
  <use href="#spark" transform="translate(262 58) scale(1.1)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(286 230) scale(.7)" fill="#FFE9E3"/>
  <use href="#spark" transform="translate(574 300) scale(.9)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(372 66) scale(.55)" fill="#14110F"/>
  <circle cx="232" cy="110" r="5" fill="#14110F"/>
  <circle cx="560" cy="420" r="6" fill="#FFB547"/>
</svg>
