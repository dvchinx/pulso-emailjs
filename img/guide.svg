<svg xmlns="http://www.w3.org/2000/svg" width="262" height="300" viewBox="0 0 262 300" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Ilustración: guía De 0 a 1.000 suscriptores</title>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#FFFFFF" opacity=".18"/>
    </pattern>
    <filter id="sh" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#14110F" flood-opacity=".3"/>
    </filter>
    <path id="spark" d="M0-12C.7-4 4-.7 12 0 4 .7.7 4 0 12-.7 4-4 .7-12 0-4-.7-.7-4 0-12z"/>
  </defs>
  <rect width="262" height="300" fill="#7B61FF"/>
  <rect width="262" height="300" fill="url(#dots)"/>
  <circle cx="214" cy="58" r="58" fill="#9B87FF"/>

  <!-- hoja trasera -->
  <g transform="translate(131 156) rotate(8)">
    <rect x="-74" y="-98" width="148" height="196" rx="10" fill="#FFB547"/>
  </g>
  <!-- portada -->
  <g transform="translate(128 154) rotate(-5)" filter="url(#sh)">
    <rect x="-74" y="-98" width="148" height="196" rx="10" fill="#FBF8F3"/>
    <rect x="-74" y="-98" width="12" height="196" rx="6" fill="#FF5A36"/>
    <text x="-48" y="-68" font-size="9" font-weight="700" letter-spacing="1.4" fill="#FF5A36">GUÍA PULSO</text>
    <text x="-48" y="-36" font-size="22" font-weight="800" fill="#14110F">De 0 a</text>
    <text x="-48" y="-10" font-size="22" font-weight="800" fill="#14110F">1.000</text>
    <text x="-48" y="10" font-size="11" fill="#6B625C">suscriptores</text>
    <polyline points="-46,66 -24,52 -6,58 16,36 46,26" fill="none" stroke="#1E8E5A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="46" cy="26" r="4.5" fill="#1E8E5A"/>
    <rect x="-46" y="76" width="58" height="6" rx="3" fill="#E9E0D6"/>
  </g>
  <use href="#spark" transform="translate(40 50) scale(1.1)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(222 250) scale(.8)" fill="#FFB547"/>
  <circle cx="34" cy="262" r="5" fill="#14110F"/>
</svg>
